<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>极夜回收线 · 浏览器试玩</title>
  <style>
    html, body { margin: 0; background: #05090f; color: #eef4fa; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; overflow-x: hidden; }
    main { max-width: 430px; margin: 0 auto; padding: 16px 12px 32px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #8fa3b8; font-size: 13px; line-height: 1.55; margin: 0 0 12px; }

    #toast { min-height: 20px; color: #ffc65c; font-size: 13px; margin-top: 10px; }

<body>
  <main>
    <h1>极夜回收线 · 浏览器试玩</h1>
    <p>协议页可用鼠标滚轮或拖动正文区下滑；滑到底后「同意并进入」才会亮起。这不是微信开发者工具截图，不能替代提审材料。</p>
    <canvas id="game" width="390" height="844"></canvas>
    <div id="toast"></div>
  </main>
  <script src="./play-bundle.js"></script>

</html>
